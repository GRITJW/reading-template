<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">四个环节，以及其中的往返</title><desc id="desc">四个环节，以及其中的往返</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#215c57"/></marker><marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b4782b"/></marker></defs><rect width="1100" height="590" rx="24" fill="#fcfaf4"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="38" y="52" fill="#243c3b" font-size="27" font-weight="700" text-anchor="start">四个环节，以及其中的往返</text><rect x="40" y="108" width="210" height="172" rx="20" fill="#ffffff" stroke="#cfdbd4" stroke-width="1.5"/><text x="60" y="146" fill="#b4782b" font-size="21" font-weight="600" text-anchor="start">01</text><text x="60" y="191" fill="#243c3b" font-size="21" font-weight="700" text-anchor="start">明确学习目标</text><text x="60" y="234" fill="#637873" font-size="16" font-weight="400" text-anchor="start">为什么学，弄清什么</text><path d="M258,195 L296,195" fill="none" stroke="#215c57" stroke-width="2.6"  marker-end="url(#arrow)"/><rect x="310" y="108" width="210" height="172" rx="20" fill="#ffffff" stroke="#cfdbd4" stroke-width="1.5"/><text x="330" y="146" fill="#b4782b" font-size="21" font-weight="600" text-anchor="start">02</text><text x="330" y="191" fill="#243c3b" font-size="21" font-weight="700" text-anchor="start">查找与选择资料</text><text x="330" y="234" fill="#637873" font-size="16" font-weight="400" text-anchor="start">找到当前适用的材料</text><path d="M528,195 L566,195" fill="none" stroke="#215c57" stroke-width="2.6"  marker-end="url(#arrow)"/><rect x="580" y="108" width="210" height="172" rx="20" fill="#215c57" stroke="#215c57" stroke-width="1.5"/><text x="600" y="146" fill="#cde1d2" font-size="21" font-weight="600" text-anchor="start">03</text><text x="600" y="191" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">逐步阅读与理解</text><text x="600" y="234" fill="#e4eee5" font-size="16" font-weight="400" text-anchor="start">接起关系，核对依据</text><path d="M798,195 L836,195" fill="none" stroke="#215c57" stroke-width="2.6"  marker-end="url(#arrow)"/><rect x="850" y="108" width="210" height="172" rx="20" fill="#ffffff" stroke="#cfdbd4" stroke-width="1.5"/><text x="870" y="146" fill="#b4782b" font-size="21" font-weight="600" text-anchor="start">04</text><text x="870" y="191" fill="#243c3b" font-size="21" font-weight="700" text-anchor="start">组织与整合知识</text><text x="870" y="234" fill="#637873" font-size="16" font-weight="400" text-anchor="start">围绕问题形成联系</text><path d="M685,289 L685,338 Q685,350 673,350 L427,350 Q415,350 415,338 L415,289" fill="none" stroke="#b4782b" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#gold)"/><text x="550" y="332" fill="#b4782b" font-size="19" font-weight="500" text-anchor="middle">按疑问补查</text><path d="M955,289 L955,401 Q955,413 943,413 L697,413 Q685,413 685,401 L685,367" fill="none" stroke="#b4782b" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#gold)"/><text x="820" y="395" fill="#b4782b" font-size="19" font-weight="500" text-anchor="middle">按关系缺口补读</text><path d="M415,368 L415,456 Q415,468 403,468 L157,468 Q145,468 145,456 L145,289" fill="none" stroke="#b4782b" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#gold)"/><text x="280" y="450" fill="#b4782b" font-size="19" font-weight="500" text-anchor="middle">必要时调整目标</text><rect x="40" y="508" width="1020" height="58" rx="15" fill="#e8f0e9" stroke="none" stroke-width="1.5"/><text x="550" y="545" fill="#215c57" font-size="23" font-weight="600" text-anchor="middle">贯穿全程：对照目标 · 核查依据 · 校正自己的理解</text></g></svg>